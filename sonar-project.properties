# ─────────────────────────────────────────────────────────────────────────────
# SonarQube — configuração da análise deste projeto (somente desenvolvimento).
# Analisado pelo SonarQube local compartilhado: `sonar-local scan`
# (ver o repositório sonarqube-docker, docs/novo-projeto.md).
# ─────────────────────────────────────────────────────────────────────────────
sonar.projectKey=sonarqube-docker
sonar.projectName=sonarqube-docker
sonar.sourceEncoding=UTF-8

# Pastas de código. Liste as pastas (em vez de `.`) para o scanner nem percorrer
# node_modules, venv, builds etc.
sonar.sources=src

# Testes. Se ficam ao lado do código (ex.: x.ts + x.test.ts), aponte para a mesma
# pasta e separe por padrão de nome com exclusions/test.inclusions.
sonar.tests=test
sonar.test.inclusions=**/*.test.ts

sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.test.*,**/*.spec.*

# Cobertura JS/TS: sem esta linha o `sonar-local` acha sozinho os `lcov.info` dentro
# de pastas `coverage/`. Declare se quiser escolher quais (caminhos relativos a esta
# pasta). Os caminhos de dentro do lcov são corrigidos automaticamente.
#sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Cobertura de outras linguagens — caminhos relativos a esta pasta, ex.:
#sonar.python.coverage.reportPaths=coverage.xml

# TypeScript: o tsconfig usado na análise (o padrão é procurar tsconfig.json).
#sonar.typescript.tsconfigPaths=tsconfig.json

# Regra desligada por conflitar com uma convenção DELIBERADA do projeto — sempre
# com o motivo ao lado, senão é dívida escondida:
#sonar.issue.ignore.multicriteria=e1
#sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S0000
#sonar.issue.ignore.multicriteria.e1.resourceKey=**/*
